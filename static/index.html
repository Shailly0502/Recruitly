<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recruitly Portal</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Recruitly <span>Portal</span></h1>
    <nav class="topbar-actions">
      <a class="button" href="/jobs">Job portal</a>
      <button id="add-button" class="button primary" type="button">Add candidate</button>
    </nav>
  </header>

  <main>
    <section class="search" aria-label="Search candidates">
      <div class="search-row">
        <input id="search" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search by name (typos are fine)"
               aria-label="Search candidates by name" aria-describedby="search-error">
        <button id="filter-toggle" class="button" type="button" aria-expanded="false" aria-controls="filters">
          Filters<span id="filter-count" class="count" hidden></span>
        </button>
      </div>
      <div id="active-filters" class="chips" aria-label="Active filters" hidden></div>
      <div id="search-error" class="query-error" role="alert" hidden></div>
      <div id="assist" class="assist" aria-live="polite" hidden></div>
      <form id="filters" class="filters" hidden>
        <div class="filter-grid">
          <div class="field">Current stage
            <details id="f-stage" class="multi"><summary>Any stage</summary><div class="options"></div></details>
          </div>
          <div class="field">Exclude stage
            <details id="f-exclude" class="multi"><summary>None</summary><div class="options"></div></details>
          </div>
          <label class="field">Time in current stage
            <select id="f-for">
              <option value="">Any</option>
              <option value='{"max_days":1}'>Less than a day</option>
              <option value='{"max_days":7}'>Less than a week</option>
              <option value='{"min_days":3}'>More than 3 days</option>
              <option value='{"min_days":7}'>More than a week</option>
              <option value='{"min_days":14}'>More than 2 weeks</option>
              <option value='{"min_days":30}'>More than 30 days</option>
            </select>
          </label>
          <label class="field">Job
            <select id="f-job"><option value="">Any job</option></select>
          </label>
          <label class="field">Reached stage
            <select id="f-reached"><option value="">Any</option></select>
          </label>
          <div class="field">When
            <div class="field-pair">
              <select id="f-when" aria-label="Reached it since, before or on" disabled>
                <option value="since">Since</option>
                <option value="before">Before</option>
                <option value="on">On</option>
              </select>
              <select id="f-date" aria-label="Day" disabled>
                <option value="">Any time</option>
                <option value="today">Today</option>
                <option value="yesterday">Yesterday</option>
                <option value="monday">Monday</option>
                <option value="7d">7 days ago</option>
                <option value="30d">30 days ago</option>
              </select>
            </div>
          </div>
          <label class="field">Never reached
            <select id="f-never"><option value="">Any</option></select>
          </label>
        </div>
        <div class="filter-actions">
          <button class="button primary" type="submit">Apply</button>
          <button id="f-clear" class="button" type="button">Clear all</button>
        </div>
      </form>
    </section>

    <section id="welcome" class="welcome" hidden>
      <h2>No candidates yet</h2>
      <p>Add your first candidate, or load a set of demo candidates to try the search.</p>
      <button id="seed-button" class="button" type="button">Load demo candidates</button>
    </section>

    <section id="board" class="board" aria-label="Pipeline board"></section>

    <section id="results" class="results" aria-label="Search results" aria-live="polite" hidden></section>
  </main>

  <footer class="footer">
    <span id="audit" class="audit"></span>
  </footer>

  <div id="backdrop" class="backdrop" hidden></div>
  <aside id="panel" class="panel" aria-label="Candidate" hidden></aside>

  <dialog id="add-dialog" class="dialog">
    <form id="add-form" method="dialog">
      <h2>Add candidate</h2>
      <label>Job ID
        <input id="add-job" name="job_id" required maxlength="40" autocomplete="off" list="job-ids"
               placeholder="e.g. JOB-001">
      </label>
      <datalist id="job-ids"></datalist>
      <div id="add-job-info" class="job-info" aria-live="polite" hidden></div>
      <label>Name <input id="add-name" name="name" required maxlength="120" autocomplete="off"></label>
      <label>Email <input id="add-email" name="email" type="email" required maxlength="254" autocomplete="off"></label>
      <label>Expected CTC per annum (optional)
        <input id="add-salary" name="expected_salary" inputmode="numeric" maxlength="20" autocomplete="off"
               placeholder="e.g. 22,00,000">
      </label>
      <label>Resume (PDF, up to 5 MB)
        <input id="add-resume" name="resume" type="file" accept="application/pdf,.pdf" required>
      </label>
      <p id="add-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button id="add-cancel" class="button" type="button">Cancel</button>
        <button id="add-submit" class="button primary" type="submit">Add to Applied</button>
      </div>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
